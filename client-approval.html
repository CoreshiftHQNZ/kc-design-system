<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Approval Portal</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Satoshi', sans-serif; background: #FAFAFA; color: #111827; }
  :root {
    --primary: #FF6B35; --primary-hover: #EF6E1E; --primary-light: #FFF0E6;
    --primary-ring: rgba(255, 107, 53, 0.12);
    --bg-card: #FFFFFF; --bg-secondary: #F1F5F9;
    --text-01: #111827; --text-02: #4B5563; --text-03: #9CA3AF;
    --success: #27C87D; --success-light: #E5F9EF;
    --error: #EF4444; --error-light: #FEF2F2;
    --blue: #3B82F6;
    --line: #E5E7EB; --border: #D1D5DB;
  }

  /* Top bar */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 32px; background: #FFFFFF; border-bottom: 1px solid var(--line);
    height: 60px;
  }
  .top-bar-left { display: flex; align-items: center; gap: 12px; }
  .top-bar-logo {
    width: 36px; height: 36px; border-radius: 10px; background: var(--primary);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .top-bar-logo svg { width: 20px; height: 20px; }
  .top-bar-title { font-size: 16px; font-weight: 700; color: var(--text-01); }
  .pending-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 20px; background: var(--primary-light);
    font-size: 13px; font-weight: 600; color: var(--primary);
  }

  /* Nav row */
  .nav-row {
    position: fixed; top: 60px; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 12px 32px; background: #FFFFFF; border-bottom: 1px solid var(--line);
    height: 48px;
  }
  .nav-dots { display: flex; gap: 8px; align-items: center; }
  .nav-dot {
    width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--text-03);
    background: transparent; cursor: pointer; transition: all 0.2s; padding: 0;
  }
  .nav-dot.active { background: var(--primary); border-color: var(--primary); }
  .nav-dot.reviewed { background: var(--success); border-color: var(--success); }
  .nav-counter { font-size: 14px; font-weight: 600; color: var(--text-02); margin-left: 4px; }

  /* Agency note */
  .agency-note {
    position: fixed; top: 108px; left: 0; right: 0; z-index: 30;
    padding: 0 32px;
  }
  .agency-note-card {
    max-width: 1200px; margin: 0 auto;
    background: #FAF8F5; border: 1px solid #E8E4DF; border-radius: 16px;
    padding: 16px 20px; display: flex; gap: 12px; align-items: flex-start;
  }
  .agency-note-icon { font-size: 18px; flex-shrink: 0; line-height: 1.4; }
  .agency-note-content { flex: 1; }
  .agency-note-label {
    font-size: 11px; font-weight: 600; color: var(--text-03);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px;
  }
  .agency-note-text { font-size: 14px; color: var(--text-02); line-height: 1.5; }

  /* Main content area */
  .main-area {
    position: fixed;
    top: 200px; bottom: 68px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .content-stage {
    position: relative;
    width: 100%; max-width: 1100px;
    height: 100%;
    padding: 0 64px;
    display: flex; align-items: center;
  }

  /* Slide container */
  .slide-wrapper {
    width: 100%; height: 100%;
    overflow: hidden; position: relative;
  }
  .slide {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: grid; grid-template-columns: 55% 45%; gap: 28px;
    align-items: start; padding: 12px 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    overflow-y: auto;
  }
  .slide.active { transform: translateX(0); opacity: 1; }
  .slide.exit-left { transform: translateX(-100%); opacity: 0; }
  .slide.exit-right { transform: translateX(100%); opacity: 0; }
  .slide.enter-left { transform: translateX(-100%); opacity: 0; }
  .slide.enter-right { transform: translateX(100%); opacity: 0; }
  .slide:not(.active):not(.exit-left):not(.exit-right):not(.enter-left):not(.enter-right) {
    transform: translateX(100%); opacity: 0; pointer-events: none;
  }

  /* Left column — SNS mockup */
  .mock-card {
    background: #FFFFFF; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .mock-profile {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
  }
  .mock-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--primary); flex-shrink: 0;
  }
  .mock-user-info {}
  .mock-username { font-size: 14px; font-weight: 600; color: #262626; }
  .mock-location { font-size: 12px; color: #999; }
  .mock-image {
    width: 100%; aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, #FFE0CC, #F5C6D0, #F0E2FF);
    display: flex; align-items: center; justify-content: center;
  }
  .mock-image svg { opacity: 0.12; }
  .mock-image-landscape { aspect-ratio: 16 / 9; }
  .mock-image-portrait { aspect-ratio: 9 / 16; max-height: 380px; background: linear-gradient(135deg, #1a1a2e, #16213e); }
  .mock-image-portrait svg { opacity: 0.5; }

  /* Right column */
  .detail-col { display: flex; flex-direction: column; gap: 20px; padding-top: 4px; }
  .platform-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px 6px 8px; border-radius: 20px;
    background: var(--bg-secondary); width: fit-content;
  }
  .platform-badge-icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .platform-badge-icon svg { width: 14px; height: 14px; }
  .platform-badge-name { font-size: 14px; font-weight: 600; color: var(--text-01); }

  .caption-box { display: flex; flex-direction: column; gap: 8px; }
  .caption-label { font-size: 12px; font-weight: 600; color: var(--text-03); text-transform: uppercase; letter-spacing: 0.5px; }
  .caption-content {
    border: 2px solid var(--blue); border-radius: 12px;
    padding: 16px; font-size: 14px; color: var(--text-01); line-height: 1.65;
    background: #FBFCFF; min-height: 120px;
  }

  /* Feedback panel */
  .feedback-panel {
    max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
  }
  .feedback-panel.open { max-height: 220px; }
  .feedback-panel-inner { padding-top: 12px; }
  .feedback-textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 14px; font-family: 'Satoshi', sans-serif; color: var(--text-01);
    background: var(--bg-secondary); resize: vertical; min-height: 72px; line-height: 1.5;
    transition: all 0.15s; margin-bottom: 10px;
  }
  .feedback-textarea:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 3px var(--primary-ring); }
  .feedback-textarea::placeholder { color: var(--text-03); }
  .btn-send-feedback {
    padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    background: var(--text-01); color: white; border: none; cursor: pointer;
    font-family: 'Satoshi', sans-serif; transition: all 0.15s;
  }
  .btn-send-feedback:hover { background: #1a1a2e; }

  .feedback-callout {
    margin-top: 12px; padding: 12px 16px; border-radius: 10px;
    background: var(--primary-light); border: 1px solid rgba(255,107,53,0.2);
    display: none;
  }
  .feedback-callout.show { display: block; }
  .feedback-callout-label { font-size: 11px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .feedback-callout-text { font-size: 13px; color: var(--text-02); line-height: 1.5; }

  /* Navigation arrows */
  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--line); background: #FFFFFF;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10; transition: all 0.15s;
    color: var(--text-02);
  }
  .nav-arrow:hover { background: var(--bg-secondary); border-color: var(--border); }
  .nav-arrow.disabled { opacity: 0.35; pointer-events: none; cursor: default; }
  .nav-arrow svg { width: 20px; height: 20px; }
  .nav-arrow-left { left: 6px; }
  .nav-arrow-right { right: 6px; }

  /* Bottom action bar */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 12px 32px; background: #FFFFFF; border-top: 1px solid var(--line);
    height: 68px;
  }
  .btn-request {
    padding: 0 28px; height: 44px; border-radius: 10px;
    font-size: 14px; font-weight: 600; background: white;
    color: var(--text-01); border: 1.5px solid var(--border);
    cursor: pointer; font-family: 'Satoshi', sans-serif;
    transition: all 0.15s; min-width: 160px;
  }
  .btn-request:hover { background: var(--bg-secondary); border-color: var(--text-03); }
  .btn-approve {
    padding: 0 28px; height: 44px; border-radius: 10px;
    font-size: 14px; font-weight: 600; background: var(--primary);
    color: white; border: none; cursor: pointer;
    font-family: 'Satoshi', sans-serif; transition: all 0.15s; min-width: 160px;
  }
  .btn-approve:hover { background: var(--primary-hover); }
  .btn-approve.approved-state { background: var(--success); pointer-events: none; }

  /* Toast */
  .toast-bar {
    position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--text-01); color: white; padding: 12px 24px; border-radius: 12px;
    font-size: 14px; font-weight: 600; font-family: 'Satoshi', sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 300;
    opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none;
    display: flex; align-items: center; gap: 8px;
  }
  .toast-bar.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Tablet / responsive */
  @media (max-width: 900px) {
    .slide { grid-template-columns: 1fr; gap: 16px; overflow-y: auto; }
    .content-stage { padding: 0 52px; }
    .agency-note { padding: 0 16px; }
    .top-bar, .bottom-bar { padding: 12px 16px; }
    .nav-arrow-left { left: 2px; }
    .nav-arrow-right { right: 2px; }
    .main-area { top: 194px; }
  }
  @media (max-width: 600px) {
    .content-stage { padding: 0 44px; }
    .btn-request, .btn-approve { min-width: 120px; padding: 0 16px; font-size: 13px; }
  }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="top-bar-left">
    <div class="top-bar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <span class="top-bar-title">Content Approval Portal</span>
  </div>
  <div class="pending-badge" id="pendingBadge">
    <span id="pendingText">4 pending</span>
  </div>
</div>

<!-- Navigation Row -->
<div class="nav-row">
  <div class="nav-dots" id="navDots">
    <button class="nav-dot active" onclick="goToSlide(0)"></button>
    <button class="nav-dot" onclick="goToSlide(1)"></button>
    <button class="nav-dot" onclick="goToSlide(2)"></button>
    <button class="nav-dot" onclick="goToSlide(3)"></button>
  </div>
  <span class="nav-counter" id="navCounter">1 / 4</span>
</div>

<!-- Agency Note -->
<div class="agency-note">
  <div class="agency-note-card">
    <span class="agency-note-icon">&#9998;</span>
    <div class="agency-note-content">
      <div class="agency-note-label">Note from your agency</div>
      <div class="agency-note-text">Hey Sarah! Here are this week's posts ready for your review. Let me know if anything needs tweaking &#128522;</div>
    </div>
  </div>
</div>

<!-- Main Content Area -->
<div class="main-area">
  <div class="content-stage">
    <!-- Left Arrow -->
    <button class="nav-arrow nav-arrow-left disabled" id="arrowLeft" onclick="navigate(-1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <!-- Slides -->
    <div class="slide-wrapper" id="slideWrapper"></div>

    <!-- Right Arrow -->
    <button class="nav-arrow nav-arrow-right" id="arrowRight" onclick="navigate(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
  </div>
</div>

<!-- Bottom Action Bar -->
<div class="bottom-bar">
  <button class="btn-request" id="btnRequest" onclick="requestChange()">Request Change</button>
  <button class="btn-approve" id="btnApprove" onclick="approvePost()">Approve</button>
</div>

<!-- Toast -->
<div class="toast-bar" id="toastBar"></div>

<script>
var currentSlide = 0;
var animating = false;

var posts = [
  {
    id: 'instagram',
    platform: 'Instagram',
    platformColor: 'linear-gradient(45deg,#f09433,#dc2743)',
    platformIcon: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5"/></svg>',
    username: 'storepro_nz',
    location: 'Auckland, NZ',
    caption: '5 Ways Retail Tech is Transforming NZ Small Business. From smart inventory to contactless payments, here\'s how local retailers are staying ahead of the curve.\n\n#RetailTech #NZBusiness #SmallBiz #Innovation',
    mockType: 'square',
    status: 'pending',
    feedback: ''
  },
  {
    id: 'facebook',
    platform: 'Facebook',
    platformColor: '#1877F2',
    platformIcon: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',
    username: 'Storepro NZ',
    location: 'Sponsored',
    caption: 'Is your retail business ready for 2026? Here are 3 tech trends NZ small businesses can\'t ignore:\n\n1. AI-powered inventory management\n2. Seamless omnichannel experiences\n3. Contactless everything\n\nDon\'t get left behind. #RetailTech #NZBusiness',
    mockType: 'landscape',
    status: 'pending',
    feedback: ''
  },
  {
    id: 'linkedin',
    platform: 'LinkedIn',
    platformColor: '#0A66C2',
    platformIcon: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M8 11v5"/><path d="M8 8v.01"/><path d="M12 16v-5"/><path d="M16 16v-3a2 2 0 0 0-4 0"/></svg>',
    username: 'Storepro',
    location: '4,200 followers',
    caption: 'The future of NZ retail is here. Small businesses that embrace technology are seeing 40% better customer retention and 25% higher average transaction values.\n\nHere\'s what the data tells us about the retail tech revolution in New Zealand.\n\n#RetailTech #Innovation #NZBusiness #FutureOfRetail',
    mockType: 'landscape',
    status: 'pending',
    feedback: ''
  },
  {
    id: 'tiktok',
    platform: 'TikTok',
    platformColor: '#111827',
    platformIcon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.88-2.89 2.89 2.89 0 0 1 2.88-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V9.19a8.16 8.16 0 0 0 4.76 1.53v-3.5a4.83 4.83 0 0 1-1-.53z"/></svg>',
    username: '@storepro_nz',
    location: '',
    caption: 'POV: Your retail store runs itself \ud83e\udd16 Here\'s how NZ small businesses are using AI to serve customers better, manage stock automatically, and boost sales while they sleep.\n\n#RetailTech #SmallBiz #NZ #AI #FYP',
    mockType: 'portrait',
    status: 'pending',
    feedback: ''
  }
];

function buildSlides() {
  var wrapper = document.getElementById('slideWrapper');
  wrapper.innerHTML = '';
  posts.forEach(function(post, i) {
    var slide = document.createElement('div');
    slide.className = 'slide' + (i === 0 ? ' active' : '');
    slide.id = 'slide-' + i;

    var mockImageClass = 'mock-image';
    var mockImageContent = '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#D1D5DB" stroke-width="1"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
    if (post.mockType === 'landscape') {
      mockImageClass += ' mock-image-landscape';
    } else if (post.mockType === 'portrait') {
      mockImageClass += ' mock-image-portrait';
      mockImageContent = '<div style="text-align:center;color:white;"><svg width="36" height="36" viewBox="0 0 24 24" fill="white" opacity="0.5"><polygon points="5 3 19 12 5 21 5 3"/></svg><div style="font-size:12px;opacity:0.6;margin-top:6px;">Video Preview</div></div>';
    }

    slide.innerHTML =
      '<div class="mock-card">' +
        '<div class="mock-profile">' +
          '<div class="mock-avatar" style="background:' + post.platformColor + ';"></div>' +
          '<div class="mock-user-info">' +
            '<div class="mock-username">' + post.username + '</div>' +
            (post.location ? '<div class="mock-location">' + post.location + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="' + mockImageClass + '">' + mockImageContent + '</div>' +
      '</div>' +
      '<div class="detail-col">' +
        '<div class="platform-badge">' +
          '<div class="platform-badge-icon" style="background:' + post.platformColor + ';">' + post.platformIcon + '</div>' +
          '<span class="platform-badge-name">' + post.platform + '</span>' +
        '</div>' +
        '<div class="caption-box">' +
          '<div class="caption-label">Caption</div>' +
          '<div class="caption-content">' + post.caption.replace(/\n/g, '<br>') + '</div>' +
        '</div>' +
        '<div class="feedback-panel" id="feedback-panel-' + i + '">' +
          '<div class="feedback-panel-inner">' +
            '<textarea class="feedback-textarea" id="feedback-text-' + i + '" placeholder="Describe what changes you\'d like..."></textarea>' +
            '<button class="btn-send-feedback" onclick="submitFeedback(' + i + ')">Send Feedback</button>' +
          '</div>' +
        '</div>' +
        '<div class="feedback-callout" id="callout-' + i + '">' +
          '<div class="feedback-callout-label">Changes Requested</div>' +
          '<div class="feedback-callout-text" id="callout-text-' + i + '"></div>' +
        '</div>' +
      '</div>';

    wrapper.appendChild(slide);
  });
}

function navigate(dir) {
  var target = currentSlide + dir;
  if (target < 0 || target >= posts.length || animating) return;
  goToSlide(target);
}

function goToSlide(index) {
  if (index === currentSlide || index < 0 || index >= posts.length || animating) return;
  animating = true;

  var oldSlide = document.getElementById('slide-' + currentSlide);
  var newSlide = document.getElementById('slide-' + index);
  var goingForward = index > currentSlide;

  // Set new slide entry position
  newSlide.className = 'slide ' + (goingForward ? 'enter-right' : 'enter-left');
  // Force reflow
  newSlide.offsetHeight;

  // Animate old out, new in
  oldSlide.className = 'slide ' + (goingForward ? 'exit-left' : 'exit-right');
  newSlide.className = 'slide active';

  currentSlide = index;
  updateUI();

  setTimeout(function() { animating = false; }, 260);
}

function updateUI() {
  // Counter
  document.getElementById('navCounter').textContent = (currentSlide + 1) + ' / ' + posts.length;

  // Arrows
  document.getElementById('arrowLeft').classList.toggle('disabled', currentSlide === 0);
  document.getElementById('arrowRight').classList.toggle('disabled', currentSlide === posts.length - 1);

  // Dots
  var dots = document.querySelectorAll('.nav-dot');
  dots.forEach(function(dot, i) {
    dot.className = 'nav-dot';
    if (i === currentSlide) dot.classList.add('active');
    if (posts[i].status === 'approved') dot.classList.add('reviewed');
    if (posts[i].status === 'changes') dot.classList.add('reviewed');
  });

  // Pending count
  var pending = posts.filter(function(p) { return p.status === 'pending'; }).length;
  document.getElementById('pendingText').textContent = pending + ' pending';

  // Bottom bar buttons
  var post = posts[currentSlide];
  var btnApprove = document.getElementById('btnApprove');
  var btnRequest = document.getElementById('btnRequest');
  if (post.status === 'approved') {
    btnApprove.textContent = 'Approved';
    btnApprove.className = 'btn-approve approved-state';
    btnRequest.style.display = 'none';
  } else if (post.status === 'changes') {
    btnApprove.textContent = 'Approve';
    btnApprove.className = 'btn-approve';
    btnRequest.style.display = 'none';
  } else {
    btnApprove.textContent = 'Approve';
    btnApprove.className = 'btn-approve';
    btnRequest.style.display = '';
  }
}

function approvePost() {
  var post = posts[currentSlide];
  if (post.status === 'approved') return;

  post.status = 'approved';
  updateUI();
  showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#27C87D" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> Post approved!');

  // Auto-advance after 0.8s
  if (currentSlide < posts.length - 1) {
    setTimeout(function() { goToSlide(currentSlide + 1); }, 800);
  }
}

function requestChange() {
  var panel = document.getElementById('feedback-panel-' + currentSlide);
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    setTimeout(function() {
      document.getElementById('feedback-text-' + currentSlide).focus();
    }, 100);
  }
}

function submitFeedback(index) {
  var text = document.getElementById('feedback-text-' + index).value.trim();
  if (!text) return;

  posts[index].status = 'changes';
  posts[index].feedback = text;

  var panel = document.getElementById('feedback-panel-' + index);
  panel.classList.remove('open');

  var callout = document.getElementById('callout-' + index);
  document.getElementById('callout-text-' + index).textContent = text;
  callout.classList.add('show');

  updateUI();
  showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Feedback sent to agency');

  // Auto-advance
  if (index < posts.length - 1) {
    setTimeout(function() { goToSlide(index + 1); }, 800);
  }
}

function showToast(html) {
  var toast = document.getElementById('toastBar');
  toast.innerHTML = html;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

// Init
buildSlides();
updateUI();
</script>
</body>
</html>
